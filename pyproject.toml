[project]
name = "trendforge"
version = "1.0.0"
description = "A complete local creator workspace for research, writing, editing and subtitling short-form video."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "imageio-ffmpeg>=0.6,<1",
  "av>=14,<17",
  "faster-whisper>=1.1,<2",
  "cryptography>=44,<47",
  "mcp>=1.12,<2",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
trendforge = "trendforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trendforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

